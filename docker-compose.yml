services:
  redis:
    image: redis:8.2-alpine@sha256:489a769e0a54dc245896132a15c72d2bc7296719954da99398f43a3877e5f8eb
    # demo-only password, the server is not exposed outside the compose network
    command: ["redis-server", "--requirepass", "demo-password"]

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=default
      - REDIS_PASSWORD=demo-password
    volumes:
      - .:/app
