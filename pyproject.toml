[project]
name = "redis-queue-library"
version = "2.0.0"
description = "Minimal Redis pub/sub publisher and subscriber exchanging JSON messages."
authors = [{ name = "Tejas", email = "tejas@ipedis.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["redis", "pubsub", "queue"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "redis>=5.2",
]

[project.urls]
Repository = "https://github.com/ipedis/redis-queue-library"
Issues = "https://github.com/ipedis/redis-queue-library/issues"

[dependency-groups]
dev = [
    "pip-audit>=2.10",
    "pytest>=9.0.3",
    "pytest-mock>=3.15",
    "python-dotenv>=1.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a reachable Redis server (skipped otherwise)"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redis_queue_library"]

[tool.hatch.build.targets.sdist]
include = ["redis_queue_library", "tests", "README.md", "LICENSE"]
